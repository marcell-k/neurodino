[project]
name = "neurodino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Kele98-star", email = "kele.marcell.mail@gmail.com" }]
requires-python = ">=3.15"
dependencies = ["pygame-ce>=2.5.8"]

[project.scripts]
neurodino = "neurodino.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.98"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "COM812",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "FIX002",
    "S311",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ERA001", "D100", "D103", "S101"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "tests"]
